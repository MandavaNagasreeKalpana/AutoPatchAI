[project]
name = "autopatch-ai"
version = "0.1.0"
description = "AST-aware multi-agent framework for automated security vulnerability remediation in Python projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bandit>=1.8,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0.1,<2",
]

[project.scripts]
autopatch = "autopatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autopatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Emitted by stevedore when Bandit loads its plugins; not from our code.
    "ignore:The verify_requirements argument is now a no-op",
]
